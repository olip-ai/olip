name: ci
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  protocol:
    name: Protocol (${{ matrix.os }}, Node ${{ matrix.node }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        node: ['20', '22']
    runs-on: ${{ matrix.os }}
    # macOS and Windows runs are reported but do not block yet: the sponsor has only run the kit on Linux.
    continue-on-error: ${{ matrix.os != 'ubuntu-latest' }}
    defaults:
      run:
        working-directory: protocol
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: '${{ matrix.node }}', cache: npm, cache-dependency-path: protocol/package-lock.json}
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - run: npm ci
      - name: Schemas, examples, both endpoints, conformance, interop, MCP adapter, walkthrough
        run: npm test
      - name: Conformance counts by endpoint
        shell: bash
        run: |
          node -e 'for (const f of ["node-endpoint","python-endpoint"]) { const r = require("./conformance/results/" + f + ".json"); console.log(f, "pass", r.pass, "fail", r.fail, "skip", r.skip); if (r.fail) process.exit(1); }'
      - uses: actions/upload-artifact@v4
        if: always()
        with: {name: 'conformance-${{ matrix.os }}-node${{ matrix.node }}', path: protocol/conformance/results/}
  site:
    name: Website, browser simulation, scans
    # Pinned: Playwright's browser install does not support newer Ubuntu images yet.
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: '22', cache: npm}
      - run: npm ci && (cd protocol && npm ci)
      - run: (cd protocol && npm test)
      - name: Release facts, browser simulation, content drift
        run: npm test
      - name: Docusaurus build (broken links and anchors fail the build)
        run: npm run build
      - name: Built site checks (internal links, downloads and SHA-256, no outbound requests from /try/)
        run: npx --yes playwright@1.56.1 install --with-deps chromium && npm run check:built
      - name: Secret and personal-data scan of the source and the built site
        run: npm run scan && node scripts/scan-publication.mjs build
      - name: Dependency audit (production dependencies)
        run: npm audit --omit=dev --audit-level=high || echo "::warning::npm audit reported issues"
  secrets:
    name: Secret scan (gitleaks, full history)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: {fetch-depth: 0}
      - name: gitleaks (no license key needed for the CLI)
        run: docker run --rm -v "$PWD:/repo" zricethezav/gitleaks:v8.21.2 detect --source /repo --redact --verbose
