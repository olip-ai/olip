name: Documentation
description: Unclear, missing or outdated documentation.
labels: [documentation]
body:
  - type: input
    id: page
    attributes: {label: Page, placeholder: "https://olip.ai/docs/..."}
    validations: {required: true}
  - type: textarea
    id: problem
    attributes: {label: What is unclear, missing or outdated}
    validations: {required: true}
  - type: textarea
    id: suggestion
    attributes: {label: Suggested wording (optional)}
